<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeFast Rx · Rule Review</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2622;--mut:#5d6964;--line:#dfe4e1;--brand:#0b5d3b;--brand2:#e6f1eb;--amber:#9a5b00;--amberbg:#fff4e0;--red:#a3271f;--redbg:#fdecea;--r:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top{max-width:980px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{color:var(--brand);font-size:1.05rem}.prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.cnt{font-size:.85rem;color:var(--mut);white-space:nowrap}.st{font-size:.8rem;color:var(--mut);min-width:70px;text-align:right}
nav{max-width:980px;margin:auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto}
nav a{flex:none;font-size:.82rem;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:#fff}
nav a.done{background:var(--brand2);border-color:#b8d6c5;color:var(--brand)}
main{max-width:980px;margin:auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 4px}h2{font-size:1.2rem;margin:34px 0 4px;color:var(--brand);scroll-margin-top:110px}
.lead{color:var(--mut);margin:0 0 12px}
.intro{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.intro p{margin:6px 0}.intro dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0;font-size:.92rem}.intro dt{font-weight:600}.intro dd{margin:0}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{min-height:44px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;scroll-margin-top:110px}
.card.ok{border-color:#b8d6c5}.card.mod{border-color:#e7c27a}.card.rem{border-color:#e4a29b}
.ch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.ch .id{font-size:.8rem;color:var(--mut);font-weight:600}
.ch h3{margin:0;font-size:1.05rem}.ch small{color:var(--mut)}
.tag{font-size:.75rem;border-radius:6px;padding:1px 7px;font-weight:600}.t-High{background:var(--redbg);color:var(--red)}.t-Moderate{background:var(--amberbg);color:var(--amber)}.t-Low{background:var(--brand2);color:var(--brand)}.t-crit{background:#1d2622;color:#fff}
.grid{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;margin:10px 0;font-size:.92rem}.grid dt{color:var(--mut)}.grid dd{margin:0;white-space:pre-line}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.seg button{font:inherit;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 16px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true][data-v=agree]{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button[aria-pressed=true][data-v=modify]{background:#c27c0e;border-color:#c27c0e;color:#fff}
.seg button[aria-pressed=true][data-v=remove]{background:var(--red);border-color:var(--red);color:#fff}
.need{color:var(--amber);font-size:.85rem;margin-top:4px}
.done-box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:12px}
.dec label{display:flex;gap:8px;align-items:center;margin:6px 0}
.submit{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 22px;margin-top:14px;cursor:pointer;font-size:1rem}
.thanks{background:var(--brand2);color:var(--brand);border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:600}
@media(max-width:640px){.grid{grid-template-columns:1fr}.grid dt{margin-top:6px}h1{font-size:1.35rem}}
</style></head><body>
<header><div class="top"><b>SafeFast Rx · Rule Review</b><div class="prog"><div class="bar"><i id="bar"></i></div><span class="cnt" id="cnt"></span></div><span class="st" id="st">Not saved</span></div><nav id="nav"></nav></header>
<main id="main"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const DATA={"R":[["1","Direct oral anticoagulants (DOAC)\nApixaban 5 mg, Rivaroxaban 20 mg","Critical medicine. Moderate","Once daily: Iftar\nTwice daily: Suhoor + Iftar","None (doctor may choose \"keep usual times\" or \"stop\")","Apixaban/dabigatran: two doses with suhoor and iftar. Rivaroxaban: once daily with the iftar meal (food improves absorption). A twice-daily DOAC is never switched to once daily except by the doctor. Never skip or double.","If remembered while not fasting and well before the next dose, take it; otherwise skip. Never take two doses together.","Heart 2022; Saudi study 2020"],["2","Warfarin\nWarfarin 5 mg","Critical medicine. Moderate","Iftar","Iftar; After Taraweeh","One fixed dose at the same time every day. INR follow-up per doctor's plan.","Take it if remembered the same night. If the day has passed, skip and inform the clinic. Never double.","Heart 2022; Saudi study 2020"],["3","Metformin\nMetformin 1 g","Moderate","Once daily: Iftar\nTwice daily: Suhoor + Iftar\nThree times daily: referred to doctor; suggested = morning dose with suhoor, noon + evening doses together with iftar","Doctor's option list","With a meal. Three doses do not fit the fasting window.","Skip and take the next dose on time.","IDF-DAR 2021"],["4","Sulfonylurea\nGliclazide MR","High (always needs the doctor)","Iftar (dose options in Section B)","Doctor's option list","Move the dose to iftar. Hypoglycaemia risk during the fast. If twice daily: reduce the suhoor dose 25–50%. Avoid glibenclamide.","Skip. Do NOT take it at suhoor to make up for it (hypoglycaemia during the fast).","IDF-DAR 2021"],["5","SGLT2 inhibitors\nEmpagliflozin 10 mg","Moderate","Iftar","None","With iftar, only if started at least 4 weeks before Ramadan, with adequate fluids. Dehydration risk, especially with diuretics and in the elderly.","Skip and take tomorrow's dose on time.","IDF-DAR 2021; Heart 2022"],["6","Basal insulin\nInsulin glargine","High (always needs the doctor)","Iftar (dose options in Section B)","Doctor's option list","Move to iftar and reduce the dose 15–30%, then titrate every 3 days on SMBG readings by the team.","Do not take an extra dose. Check glucose and contact the pharmacist.","IDF-DAR 2021"],["7","Prandial insulin\nInsulin aspart","High (always needs the doctor)","No automatic plan; suggested = usual dose at iftar, omit lunch dose, reduce suhoor dose 25–50%","Doctor's option list","Multiple mealtime doses: the plan is the doctor's.","If the meal is over, skip. Never take mealtime insulin without food.","IDF-DAR 2021"],["8","Once-daily antihypertensives\nAmlodipine 5 mg, Losartan 50 mg, Bisoprolol 5 mg","Low","Iftar","Iftar; After Taraweeh; Suhoor","Move to iftar; review BP and renal function before Ramadan. After Taraweeh for patients dizzy after iftar; suhoor if BP rises during the day (watch for dizziness while fasting).","Take if remembered before suhoor; otherwise skip and take tomorrow's dose.","Heart 2022"],["9","Loop diuretics\nFurosemide 40 mg","Moderate","Iftar","None","After iftar so thirst does not increase during the day. Risk of dehydration, AKI and electrolyte disturbance.","Skip; take tomorrow after iftar. Do not take it at suhoor.","Heart 2022"],["10","Statins\nAtorvastatin 40 mg","Low","After Taraweeh","After Taraweeh; Iftar","Evening after Taraweeh. Atorvastatin and rosuvastatin are long-acting, so iftar is acceptable.","Skip and take the next dose on time.","No Ramadan source found (pending review)"],["11","Thyroid hormone\nLevothyroxine 100 mcg","Low","Suhoor (30 min before, empty stomach)","Before suhoor; After Taraweeh (≥3 h after food)","Empty stomach 30 min before suhoor. Studied alternative: 30 min before iftar (Saudi study 2022). TSH 6–8 weeks after Ramadan.","Take as soon as possible on an empty stomach, or skip to the next day. Never double.","No Ramadan guideline (pending review)"],["12","Calcium + vitamin D\nCalcium carbonate 600 mg + D3","Low","Iftar","Iftar; After Taraweeh; Suhoor (only if not on levothyroxine)","With iftar (food improves absorption), at least 4 h apart from levothyroxine.","Skip and take the next dose on time.","Product label"],["13","Proton pump inhibitors\nOmeprazole 20 mg","Low","Suhoor (30 min before)","Suhoor; Before iftar","30 min before suhoor because acidity rises with daytime fasting; before iftar if symptoms are after iftar.","Skip and take the next dose on time.","No Ramadan source found (pending review)"],["14","Antiepileptics\nLevetiracetam 500 mg","Critical medicine. Moderate","Once daily: Iftar\nTwice daily: Suhoor + Iftar\nThree times daily: referred to doctor; suggested = same daily dose split into suhoor + iftar, decided by the neurologist","Doctor's option list","Missed doses may cause seizures.","Take as soon as remembered while not fasting. If fasting and close to iftar, take it at iftar. If a seizure occurs: break the fast and call the doctor.","Epilepsy Behav 2020"],["15","Antibiotics (acute illness)\nAmoxicillin 500 mg, Clarithromycin 500 mg","High (always needs the doctor)","No automatic plan; suggested = keep usual times and postpone fasting until the course ends","Doctor's option list","Multiple doses during an acute illness.","Ask the pharmacist; do not fast until the course is finished.","No Ramadan source found (pending review)"],["16","NSAIDs\nIbuprofen 400 mg","Moderate","Once daily: Iftar\nTwice daily: Iftar + After Taraweeh\nThree times daily: referred to doctor","Doctor's option list","After food only; avoid with dehydration or renal impairment. Paracetamol is safer while fasting.","Skip. Never on an empty stomach.","Product label"],["17","Antiplatelets\nAspirin 81 mg","Low","Iftar","Iftar; After Taraweeh","One dose with or after iftar to reduce gastric irritation.","Take with the next iftar. Never double.","Heart 2022"],["18","Any medicine not in the library","High (always needs the doctor)","No plan; automatically referred to the doctor","—","Safety net: anything without a rule goes to the doctor.","Ask the pharmacist.","—"]],"X":[["1","DOAC + DOAC (e.g. apixaban + rivaroxaban)","High","Two anticoagulants together: major bleeding risk.","Confirm one has been stopped; never dispense both.","Product label"],["2","Warfarin + antibiotic","High","Antibiotic may raise INR and bleeding risk.","Check INR within 3–5 days of starting the antibiotic.","Product label"],["3","Anticoagulant + NSAID","High","Increased GI bleeding risk.","Use paracetamol for pain instead.","Product label"],["4","Anticoagulant + antiplatelet","Moderate","Combined bleeding risk.","Confirm the combination is intended by cardiology and time-limited.","Product label"],["5","DOAC + clarithromycin","Moderate","Clarithromycin raises DOAC plasma levels (CYP3A4/P-gp).","Consider another antibiotic, or monitor for bleeding.","Product label"],["6","Statin + clarithromycin","High","Risk of myopathy / rhabdomyolysis.","Hold the statin until the antibiotic course ends.","Product label"],["7","SGLT2 inhibitor + loop diuretic","Moderate","Additive volume depletion and hypotension; fasting doubles the risk.","Review the diuretic dose, or pause the SGLT2 inhibitor during Ramadan.","Heart 2022"],["8","Losartan (ARB) + NSAID","Moderate","Renal impairment with dehydration; worse if a diuretic is also used (\"triple whammy\").","Avoid NSAIDs while fasting.","RaK 2024"],["9","NSAID + SGLT2 inhibitor or diuretic","Moderate","AKI risk with dehydration while fasting.","Use paracetamol; ensure adequate fluids between iftar and suhoor.","RaK 2024"],["10","Sulfonylurea + insulin (basal or prandial)","Moderate","Combined hypoglycaemia risk during the fast.","Consider reducing or stopping the sulfonylurea in Ramadan.","IDF-DAR 2021"],["11","Bisoprolol + sulfonylurea or insulin","Moderate","Beta-blocker masks adrenergic hypoglycaemia symptoms (tremor, palpitations).","Teach that sweating and hunger may be the only signs; check glucose whenever in doubt.","Product label"],["12","Duplicate class (two drugs from the same class, except anticoagulants, once-daily antihypertensives and antibiotics)","Moderate","Possible therapeutic duplication.","Confirm the combination is intended.","Product label"]],"DOSE":[["Sulfonylurea (once daily, e.g. gliclazide MR 60 mg)","a) Same dose with iftar (default)\nb) Reduce 50% with iftar (if glucose well controlled)","If the patient reports hypoglycaemia: default becomes (b) −50%.","IDF-DAR 2021"],["Basal insulin (e.g. glargine 20 U)","a) No reduction, at iftar\nb) −15% at iftar\nc) −20% at iftar (default)\nd) −30% at iftar\nThen titrate every 3 days on SMBG.","If the patient reports hypoglycaemia: default becomes (d) −30%.","IDF-DAR 2021"],["Prandial insulin (e.g. aspart 20 U per meal)","a) Usual dose at iftar, suhoor −25%, omit lunch dose (default)\nb) Usual dose at iftar, suhoor −50%, omit lunch dose","If the patient reports hypoglycaemia: default becomes (b) −50%.","IDF-DAR 2021"]],"ANS":[["Severe hypoglycaemia in the last 3 months (needed help or ER)","IDF-DAR score +5.5 (high risk). Largest dose reduction becomes the default for insulin and sulfonylurea."],["Glucose below 70 mg/dL once a week or more","IDF-DAR score +3.5. Largest dose reduction becomes the default; closer follow-up."],["No home glucose meter / cannot use it","IDF-DAR score +2. Meter and training needed before Ramadan."],["Advanced CKD or dialysis","High renal risk. Doctor must decide on fasting before any plan."],["Pregnant or breastfeeding (female patients)","High risk. Doctor must decide on fasting before any plan."],["Had to break the fast or go to ER last Ramadan","IDF-DAR score +1; closer follow-up."],["Changed own medicines last Ramadan without asking","Pharmacist counselling focus; closer follow-up."],["Usually skips suhoor","Food-dependent medicines move off suhoor: metformin/sulfonylurea twice daily → Iftar + After Taraweeh (once daily → Iftar); levothyroxine → After Taraweeh; PPI → before Iftar; calcium and once-daily antihypertensives → Iftar."],["Night-shift work in Ramadan","Shown to the doctor for timing decisions."],["Lives alone without help with medicines","Pharmacist counselling focus; closer follow-up."]],"OTHER":[["Sick-day pause","On a dehydrating sick day (vomiting, diarrhoea, fever): pause SGLT2 inhibitors, metformin, diuretics, sulfonylureas and losartan (ARB) until eating and drinking normally (IDF-DAR sick-day rules)."],["Monitoring: warfarin","INR in week 1–2 of Ramadan and one week after Eid."],["Monitoring: levothyroxine","TSH 6–8 weeks after Ramadan."],["Monitoring: insulin","SMBG daily before iftar and 2 h after; team titrates every 3 days."],["Monitoring: sulfonylurea","SMBG at midday and before iftar, especially in week 1."],["Monitoring: SGLT2 inhibitor, diuretic","Renal function and electrolytes before Ramadan; adequate fluids between iftar and suhoor."],["When to break the fast (patient leaflet)","Glucose < 70 mg/dL, or > 300 mg/dL, or symptoms of hypoglycaemia, dehydration, chest pain, seizure. Emergency: 997."]],"Q":["Rivaroxaban once daily with iftar (food-dependent absorption): do you agree, or would you prefer after Taraweeh with a meal?","Metformin three times daily → morning dose at suhoor and noon + evening doses combined at iftar: is combining two 1 g doses at iftar acceptable, or should the doctor switch to extended-release?","Statins, levothyroxine, PPIs and antibiotics have no published Ramadan guideline. Are our default timings (Section A, rows 10, 11, 13, 15) acceptable as expert opinion?","Sulfonylurea default for a once-daily dose is \"same dose at iftar\" unless the patient reports hypoglycaemia. Should the default be a reduction for everyone (e.g. elderly ≥ 65)?","Basal insulin default reduction is 20% (range 15–30%). Is 20% a reasonable default?","Is any clinically important interaction missing from Section C for these 21 medicines?","\"After Taraweeh\" is calculated as Maghrib + 3 hours (Isha = Maghrib + 2 h in Ramadan by Umm al-Qura, plus ~1 h Taraweeh). Is this a sensible slot for evening medicines?"]};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOC='review1',LS='safefast-review1';
let S={a:{},c:{},f:{},sign:{},submitted:false};
try{const l=JSON.parse(localStorage.getItem(LS)||'null');if(l)S=Object.assign(S,l);}catch(_){}
const secs=[];
const lines=x=>String(x).split('\n');
// Section A
secs.push({k:'A',t:'A. Timing rules',lead:'What the app suggests for each drug class. The doctor always decides; the pharmacist only dispenses and counsels.',items:DATA.R.map(r=>{const[n,cls,lvl,sug,opt,why,miss,src]=r;const L=lines(cls);
 return{id:'A'+n,title:L[0],sub:L.slice(1).join(' '),tags:[lvl.includes('Critical')?'crit':'',lvl.includes('High')?'High':lvl.includes('Moderate')?'Moderate':'Low'],rows:[['Suggested timing',sug],['Other options',opt],['Rationale & cautions',why],['Missed-dose advice',miss],['Source',src]]};})});
secs.push({k:'B',t:'B. Dose adjustments',lead:'Options shown to the doctor in a dropdown. The default is pre-selected.',items:DATA.DOSE.map((r,i)=>({id:'B'+(i+1),title:r[0],rows:[['Options',r[1]],['Effect of patient answers',r[2]],['Source',r[3]]]}))});
secs.push({k:'C',t:'C. Interaction checker',lead:'Alerts shown to the doctor before building the plan.',items:DATA.X.map(r=>({id:'C'+r[0],title:r[1],tags:[r[2]],rows:[['Alert',r[3]],['Suggested action',r[4]],['Source',r[5]]]}))});
secs.push({k:'D',t:'D. Patient questions',lead:'Patients answer yes/no on their phone before Ramadan. A "yes" changes the plan or risk score as below.',items:DATA.ANS.map((r,i)=>({id:'D'+(i+1),title:r[0],rows:[['Effect',r[1]]]}))});
secs.push({k:'E',t:'E. Sick days & monitoring',lead:'',items:DATA.OTHER.map((r,i)=>({id:'E'+(i+1),title:r[0],rows:[['Rule',r[1]]]}))});
const ALL=secs.flatMap(s=>s.items);
function card(it){const v=S.a[it.id]||'';
 return `<div class="card ${v==='agree'?'ok':v==='modify'?'mod':v==='remove'?'rem':''}" id="${it.id}"><div class="ch"><span class="id">${it.id}</span><h3>${esc(it.title)}</h3>${(it.tags||[]).filter(Boolean).map(t=>`<span class="tag t-${t}">${t==='crit'?'Critical medicine':t}</span>`).join('')}${it.sub?`<small>${esc(it.sub)}</small>`:''}</div>
 <dl class="grid">${it.rows.map(([k,x])=>`<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl>
 <div class="seg" role="group" aria-label="Review ${it.id}">${[['agree','Agree'],['modify','Modify'],['remove','Remove']].map(([k,l])=>`<button type="button" data-id="${it.id}" data-v="${k}" aria-pressed="${v===k}">${l}</button>`).join('')}</div>
 <textarea data-c="${it.id}" placeholder="${v==='modify'?'What should it be?':v==='remove'?'Why remove it?':'Comment (optional)'}">${esc(S.c[it.id]||'')}</textarea>
 ${(v==='modify'||v==='remove')&&!(S.c[it.id]||'').trim()?'<div class="need">Please write the change or reason.</div>':''}</div>`;}
function render(){const m=document.getElementById('main');
 m.innerHTML=`<h1>Medication Rule Review for Ramadan Fasting</h1><p class="lead">SafeFast Rx (صيامٌ آمن) · ruleset 1448.2.0</p>
 <div class="intro"><p>Thank you for reviewing. For each rule tap <b>Agree</b>, <b>Modify</b> or <b>Remove</b>, and write any change in the box. Your answers save automatically, so you can stop and come back later on the same link.</p>
 <label class="f" for="rname">Your name</label><input type="text" id="rname" data-s="name" value="${esc(S.sign.name||'')}" placeholder="Dr. ...">
 <dl><dt>Suhoor</dt><dd>Pre-dawn meal, before Fajr</dd><dt>Iftar</dt><dd>Sunset meal at Maghrib</dd><dt>After Taraweeh</dt><dd>Maghrib + 3 h (Isha is Maghrib + 2 h in Ramadan by Umm al-Qura, plus about 1 h Taraweeh)</dd><dt>Prototype</dt><dd><a href="./" target="_blank">Open the app</a> · <a href="https://youtu.be/lUWN5GkLcV8" target="_blank">3-min video</a></dd></dl></div>
 ${secs.map(s=>`<h2 id="s${s.k}">${s.t}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}${s.items.map(card).join('')}`).join('')}
 <h2 id="sF">F. Questions we are least sure about</h2>
 ${DATA.Q.map((q,i)=>`<div class="card" id="F${i+1}"><div class="ch"><span class="id">F${i+1}</span></div><p style="margin:6px 0 8px">${esc(q)}</p><textarea data-f="${i+1}" placeholder="Your answer">${esc(S.f[i+1]||'')}</textarea></div>`).join('')}
 <h2 id="sG">Sign-off</h2><div class="done-box"><div class="dec">${[['approved','Approved as written'],['changes','Approved with the changes marked above'],['not','Not approved']].map(([k,l])=>`<label><input type="radio" name="dec" value="${k}" ${S.sign.dec===k?'checked':''}> ${l}</label>`).join('')}</div>
 <label class="f" for="gen">General comments</label><textarea id="gen" data-s="gen">${esc(S.sign.gen||'')}</textarea>
 <label class="f" for="title">Title and department</label><input type="text" id="title" data-s="title" value="${esc(S.sign.title||'')}">
 <label class="dec" style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="perm" ${S.sign.perm?'checked':''}> You may list my name as clinical reviewer in the app and the competition submission.</label>
 <button class="submit" id="sub" type="button">${S.submitted?'Update submitted review':'Submit review'}</button>${S.submitted?'<div class="thanks">Submitted. Thank you! You can still edit and submit again.</div>':''}</div><div style="height:40px"></div>`;
 prog();}
function prog(){const n=ALL.filter(i=>S.a[i.id]).length;document.getElementById('bar').style.width=(100*n/ALL.length)+'%';document.getElementById('cnt').textContent=n+' / '+ALL.length+' rules reviewed';
 document.getElementById('nav').innerHTML=secs.map(s=>`<a href="#s${s.k}" class="${s.items.every(i=>S.a[i.id])?'done':''}">${s.k} · ${s.t.slice(3)}</a>`).join('')+'<a href="#sF">F · Questions</a><a href="#sG">Sign-off</a>';}
let db=null,tm=null;const st=t=>document.getElementById('st').textContent=t;
function save(){S._t=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(_){}clearTimeout(tm);st('Saving…');tm=setTimeout(()=>{if(!db){st('Saved on this device');return;}
 db.collection('config').doc(DOC).set({j:JSON.stringify(S),t:Date.now()}).then(()=>st('Saved ✓')).catch(()=>st('Saved on this device'));},700);}
document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(b){const id=b.dataset.id;S.a[id]=S.a[id]===b.dataset.v?'':b.dataset.v;const y=window.scrollY;const c=document.getElementById(id);c.outerHTML=card(ALL.find(i=>i.id===id));prog();save();if(S.a[id]==='modify'||S.a[id]==='remove')document.querySelector(`[data-c="${id}"]`).focus({preventScroll:true});return;}
 if(e.target.id==='sub'){S.submitted=true;S.sign.at=new Date().toISOString();save();render();document.getElementById('sG').scrollIntoView();}});
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.c){S.c[x.dataset.c]=x.value;const n=x.parentNode.querySelector('.need');if(n&&x.value.trim())n.remove();}else if(x.dataset.f)S.f[x.dataset.f]=x.value;else if(x.dataset.s)S.sign[x.dataset.s]=x.value;else if(x.name==='dec')S.sign.dec=x.value;else if(x.id==='perm')S.sign.perm=x.checked;else return;save();});
document.addEventListener('change',e=>{const x=e.target;if(x.name==='dec'){S.sign.dec=x.value;save();}else if(x.id==='perm'){S.sign.perm=x.checked;save();}});
render();
try{if(window.SF_FIREBASE&&window.firebase){firebase.initializeApp(window.SF_FIREBASE);db=firebase.firestore();
 db.collection('config').doc(DOC).get().then(d=>{if(d.exists){const r=JSON.parse(d.data().j);const lt=JSON.parse(localStorage.getItem(LS)||'null');if(!lt||(d.data().t>(lt._t||0))){S=Object.assign({a:{},c:{},f:{},sign:{}},r);render();}}st('Connected');}).catch(()=>st('Offline: saving on this device'));}}catch(_){st('Offline: saving on this device');}
</script></body></html>
