<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b4d">
<title>صيامٌ آمن · الصيدلي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* Direction: a community pharmacy counter before Ramadan.
   The plan is a pill organiser with three compartments (iftar, bedtime, suhoor);
   the patient receives it as a printed dispensing label. One bold element: the organiser. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunken:#e9eeeb; --well:#f6f8f7; --line:#dbe2de; --line2:#c5cfca;
  --ink:#13211b; --muted:#56655e; --faint:#86948d;
  --brand:#0b6b4d; --brand-ink:#ffffff; --brand-soft:#e0efe8; --brand-deep:#074d37;
  --suhoor:#3c4da0; --suhoor-soft:#e7eaf7; --iftar:#b0560f; --iftar-soft:#fbeadb; --bed:#526170; --bed-soft:#e8ecef;
  --red:#b3261e; --red-soft:#fbe8e6; --amber:#935600; --amber-soft:#fbefd9; --green:#0b6b4d; --green-soft:#e0efe8;
  --focus:#c98a00; --lift:0 1px 0 rgba(19,33,27,.04),0 10px 30px -12px rgba(19,33,27,.18);
  --f-display:"Almarai",Tahoma,sans-serif;
  --f-body:"Almarai","Segoe UI",Tahoma,system-ui,sans-serif;
  --r-box:14px; --r-ctl:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunken:#1b2521; --well:#121a17; --line:#25312c; --line2:#34423c;
  --ink:#e3ebe7; --muted:#9aa9a2; --faint:#6f7e77;
  --brand:#52c79c; --brand-ink:#05231a; --brand-soft:#16372b; --brand-deep:#7fdcb9;
  --suhoor:#a3adf2; --suhoor-soft:#1e2442; --iftar:#f0a266; --iftar-soft:#3a2615; --bed:#b0bdc8; --bed-soft:#222b31;
  --red:#ff8b80; --red-soft:#3a1b18; --amber:#f2b657; --amber-soft:#382810; --green:#52c79c; --green-soft:#16372b;
  --focus:#f2c14e; --lift:0 1px 0 rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunken:#1b2521; --well:#121a17; --line:#25312c; --line2:#34423c;
  --ink:#e3ebe7; --muted:#9aa9a2; --faint:#6f7e77;
  --brand:#52c79c; --brand-ink:#05231a; --brand-soft:#16372b; --brand-deep:#7fdcb9;
  --suhoor:#a3adf2; --suhoor-soft:#1e2442; --iftar:#f0a266; --iftar-soft:#3a2615; --bed:#b0bdc8; --bed-soft:#222b31;
  --red:#ff8b80; --red-soft:#3a1b18; --amber:#f2b657; --amber-soft:#382810; --green:#52c79c; --green-soft:#16372b;
  --focus:#f2c14e; --lift:0 1px 0 rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance;font-weight:700}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-inline:max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-left,0px))}
.top-in{max-width:1480px;margin:0 auto;display:flex;align-items:stretch;gap:28px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;color:var(--brand)}
.views{display:flex;gap:4px}
.views button{border:0;background:none;padding:0 12px;font-size:.92rem;color:var(--muted);position:relative}
.views button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.views button[aria-pressed="true"]::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
.views button:hover{color:var(--ink)}
.top .spacer{flex:1}
.ctx{display:flex;align-items:center;font-size:.84rem;color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px}
.iconbtn{border:0;background:none;color:var(--muted);border-radius:var(--r-ctl);width:36px;height:36px;display:grid;place-items:center}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync[data-s="live"] i,.sync[data-s="tabs"] i{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sync[data-s="connecting"] i{background:var(--amber)}
.sync[data-s="error"] i,.sync[data-s="stale"] i{background:var(--red)}

/* ---------- layout ---------- */
.shell{max-width:1480px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:230px minmax(0,1fr) 356px;gap:28px;align-items:start}
.maincol{display:flex;flex-direction:column;gap:20px;min-width:0}
.foot{max-width:1480px;margin:0 auto;padding:18px 20px 30px;border-top:1px solid var(--line);font-size:.78rem;color:var(--faint);display:flex;flex-direction:column;gap:2px}

/* ---------- patient list ---------- */
.queue{position:sticky;top:84px}
.qh{display:flex;align-items:baseline;justify-content:space-between;padding:0 12px 10px}
.qh h2{font-size:.95rem}
.qh .qn{font-size:.85rem;color:var(--faint)}
.qlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.qitem{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:12px 14px;border-bottom:1px solid var(--line);border-radius:0}
.qitem.lv-red{--lv:var(--red)}.qitem.lv-amber{--lv:var(--amber)}.qitem.lv-green{--lv:var(--brand)}
.qitem .qname{font-weight:700;font-size:.98rem}
.qitem .qsub{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.qitem:hover{background:var(--surface)}
.qitem[aria-current="true"]{background:var(--surface)}
.qitem[aria-current="true"] .qname{color:var(--brand)}
.qitem:focus-visible{outline:2.5px solid var(--focus);outline-offset:-2px}
.st{font-size:.78rem;font-weight:700;white-space:nowrap}
.s-wait{color:var(--amber)}.s-doc{color:var(--suhoor)}.s-done{color:var(--brand)}.s-call{color:var(--red)}

/* ---------- patient heading ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px}
.phead h1{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.2}
.phead .meta{flex-basis:100%;color:var(--muted);font-size:.9rem}
.tri{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:var(--lv)}
.tri.lv-red{--lv:var(--red)}.tri.lv-amber{--lv:var(--amber)}.tri.lv-green{--lv:var(--brand)}
.tri i{width:10px;height:10px;border-radius:3px;background:var(--lv)}
.tri .chev{width:15px;height:15px;transition:transform .2s}
.tri[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tri:hover span{text-decoration:underline;text-underline-offset:4px}
.why{list-style:none;margin:6px 0 0;padding:12px 16px;flex-basis:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.why li{display:flex;gap:10px;align-items:baseline}
.why .k{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(-1px)}
.clr{font-size:.84rem;font-weight:700;padding:3px 10px;border-radius:6px}
.clr.yes{background:var(--brand-soft);color:var(--brand)}.clr.no{background:var(--red-soft);color:var(--red)}
.alert{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r-ctl);background:var(--red-soft);color:var(--red);font-weight:700;font-size:.92rem}
.alert svg{width:20px;height:20px;flex:none}

/* ---------- the organiser (the one loud element) ---------- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-box);box-shadow:var(--lift)}
.organiser{padding:14px}
.comps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 64px;gap:10px}
.comp{border-radius:11px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;min-height:170px;overflow:hidden;transition:border-color .15s,background .15s}
.comp .lid{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--zs);color:var(--z);border-bottom:2px solid var(--z)}
.comp .lid svg{width:18px;height:18px}
.comp .lid b{font-family:var(--f-display);font-size:1.02rem;font-weight:800}
.comp .lid .tm{margin-inline-start:auto;font-size:.8rem;font-weight:700}
.c-iftar{--z:var(--iftar);--zs:var(--iftar-soft)}.c-bed{--z:var(--bed);--zs:var(--bed-soft)}.c-suhoor{--z:var(--suhoor);--zs:var(--suhoor-soft)}
.comp .well{flex:1;padding:10px;display:flex;flex-direction:column;gap:7px}
.comp .empty{margin:auto;font-size:.8rem;color:var(--faint)}
.fastcol{border-radius:11px;display:grid;place-items:center;text-align:center;font-size:.76rem;color:var(--faint);background:var(--sunken)}
.fastcol b{display:block;font-size:.88rem;color:var(--muted)}
.comp.over,.tray.over{border-color:var(--z,var(--red));background:var(--zs,var(--red-soft))}
.organiser.picking .comp,.organiser.picking .tray{border-style:dashed;border-color:var(--line2);cursor:pointer}
.organiser.picking .comp:hover{border-color:var(--z)}

.tok{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;font-weight:700;
  cursor:grab;user-select:none;touch-action:none;transition:transform .12s,box-shadow .12s,opacity .12s}
.tok:hover{box-shadow:0 3px 10px -4px rgba(19,33,27,.25);transform:translateY(-1px)}
.tok .cap{width:22px;height:10px;border-radius:6px;flex:none;background:linear-gradient(90deg,var(--c1) 50%,var(--c2) 50%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.tok .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .n2{font-size:.72rem;color:var(--faint);font-weight:400}
.tok .ok{margin-inline-start:auto;width:16px;height:16px;color:var(--brand);display:none}
.tok.ap .ok{display:block}
.tok.crit{border-color:var(--red);border-inline-start-width:3px}
.tok.picked{outline:2.5px solid var(--focus);outline-offset:2px}
.tok.dragging{opacity:.3}
.dragghost{position:fixed;z-index:100;pointer-events:none;transform:translate(50%,-50%) rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.22)!important;opacity:.96}
.tray{margin-top:10px;border:1px dashed var(--line2);border-radius:11px;padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:50px;--z:var(--red);--zs:var(--red-soft)}
.tray>b{font-size:.84rem;color:var(--red);margin-inline-end:4px}
.tray.empty>b{color:var(--faint);font-weight:400}
.hint{margin-top:8px;font-size:.84rem;color:var(--focus);font-weight:700}
.orgfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.8rem;color:var(--faint)}

/* ---------- ledger ---------- */
.ledger{padding:6px 0 0}
.lhead{display:flex;align-items:baseline;justify-content:space-between;padding:12px 20px 8px}
.lhead h2{font-size:1rem}
.lhead span{font-size:.82rem;color:var(--faint)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 190px 40px;gap:14px;align-items:center;padding:11px 20px;border-top:1px solid var(--line)}
.mrow .nm b{font-size:.97rem;display:inline}
.mrow .nm .fq{display:block;font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;margin-inline-start:8px;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:5px;vertical-align:2px}
.tag.crit{background:var(--red-soft);color:var(--red)}
.tag.dr{background:var(--suhoor-soft);color:var(--suhoor)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.warn{display:block;margin-top:4px;font-size:.8rem;color:var(--amber);font-weight:700}
.stopped{font-size:.84rem;color:var(--red);font-weight:700}
.apv{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);color:var(--line2);display:grid;place-items:center;transition:background .15s,border-color .15s}
.apv svg{width:16px;height:16px}
.apv:hover{border-color:var(--brand);color:var(--brand)}
.apv[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.signbar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line);background:var(--well);border-radius:0 0 var(--r-box) var(--r-box)}
.signbar .cnt{font-size:.86rem;color:var(--muted);margin-inline-end:auto}
.signbar .cnt b{color:var(--ink)}
.btn{border:0;border-radius:var(--r-ctl);background:var(--brand);color:var(--brand-ink);padding:10px 18px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--brand-deep)}
.btn:disabled{background:var(--sunken);color:var(--faint);cursor:not-allowed}
.btn.quiet{background:none;color:var(--brand);padding:10px 8px}
.btn.quiet:hover{text-decoration:underline;text-underline-offset:4px;background:none}
.btn.quiet:disabled{color:var(--faint);text-decoration:none}
.signed{display:inline-flex;align-items:center;gap:8px;color:var(--brand);font-weight:700;font-size:.92rem}
.signed svg{width:18px;height:18px}

/* ---------- dropdown ---------- */
.dd{position:relative;min-width:150px}
.dd.wide{min-width:240px;display:inline-block}
.dd.mini{min-width:110px}
.dd.off{opacity:.4;pointer-events:none}
.ddb{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-ctl);padding:7px 12px;font-size:.88rem;text-align:start}
.ddb svg{width:15px;height:15px;color:var(--faint);flex:none;transition:transform .15s}
.ddb[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddb:hover{border-color:var(--faint)}
.ddb.doc{color:var(--red);font-weight:700}
.ddb.ok{color:var(--brand);font-weight:700}
.ddm{position:absolute;top:calc(100% + 4px);inset-inline:0;min-width:100%;width:max-content;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 16px 36px -10px rgba(19,33,27,.3);display:flex;flex-direction:column}
.ddm button{border:0;background:transparent;text-align:start;padding:8px 12px;border-radius:7px;font-size:.88rem;color:var(--ink)}
.ddm button:hover,.ddm button:focus-visible{background:var(--sunken);outline:none}
.ddm button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.ddm button.doc{color:var(--red)}
.ddm button.ok{color:var(--brand)}

/* ---------- doctor ---------- */
.ask{padding:20px}
.ask h2{font-family:var(--f-display);font-size:1.25rem;font-weight:800;margin-bottom:4px}
.ask .meta{color:var(--muted);font-size:.88rem;margin-bottom:14px}
.ask .because{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ask .because span{font-size:.8rem;background:var(--red-soft);color:var(--red);padding:2px 9px;border-radius:5px;font-weight:700}
.drrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.drrow .nm b{font-size:1rem}
.drrow .nm .en{font-size:.8rem;color:var(--faint);margin-inline-start:8px}
.drrow .nm p{font-size:.84rem;color:var(--muted);margin-top:2px}
.drc{display:flex;gap:8px}
.drc .dd{min-width:150px}
.none{padding:16px 20px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

/* ---------- phone ---------- */
.phonecol{position:sticky;top:84px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phonecap{font-size:.8rem;color:var(--faint);text-align:center}
.phone{width:350px;max-width:100%;height:700px;border-radius:46px;background:#101513;padding:10px;box-shadow:0 30px 60px -30px rgba(19,33,27,.55),0 0 0 1px #2a332f}
.screen{position:relative;height:100%;border-radius:37px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:13px 26px 4px;font-size:.74rem;font-weight:700;direction:ltr}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:92px;height:26px;background:#101513;border-radius:20px}
.app{flex:1;overflow-y:auto;padding:8px 16px 18px;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.hello{margin:6px 0 14px}
.hello small{display:block;font-size:.78rem;color:var(--muted)}
.hello h3{font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.lead{font-size:.88rem;color:var(--muted);margin-bottom:12px}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding:7px 6px 16px}
.ptabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--faint);padding:4px 0;position:relative}
.ptabs button svg{width:21px;height:21px}
.ptabs button[aria-selected="true"]{color:var(--brand);font-weight:700}
.ptabs button:focus-visible{outline:2.5px solid var(--focus)}
.ptabs .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.toast{visibility:hidden;opacity:0;position:absolute;top:44px;inset-inline:10px;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:.8rem;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.9,.3,1.15),opacity .2s,visibility .35s;z-index:5}
.toast.show{transform:none;visibility:visible;opacity:1}
.toast .ico{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.toast .ico svg{width:18px;height:18px}

.qcard{background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;font-size:.88rem}
.qrow+.qrow{border-top:1px solid var(--line)}
.sw{all:unset;cursor:pointer;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{right:21px}
.sw:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.sec{font-size:.86rem;font-weight:700;margin:18px 0 6px}
.mylist div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.88rem}
.mylist .muted{font-size:.8rem}

/* waiting */
.wait{padding:8px 4px}
.wait h4{font-family:var(--f-display);font-size:1.2rem;font-weight:800;margin:4px 0 6px}
.wait>p{font-size:.86rem;color:var(--muted)}
.steps{list-style:none;padding:0;margin:20px 0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;font-size:.88rem;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::before{content:"";position:absolute;right:12px;top:26px;bottom:2px;width:2px;background:var(--line)}

const PATH={remote:'خطة عن بعد بلا زيارة',phone:'استشارة هاتفية',visit:'زيارة عيادة قبل رمضان'};
function idfdar(id){const p=PP(id),c=p.cl.dm;if(!c)return null;const a=per[id].answers,cls=medsOf(id).map(([k])=>(DRUGS[k]||DRUGS.other).cls),it=[];
  const add=(t,v)=>{if(v)it.push([t,v]);};
  add('سكري النوع الأول',c.type===1?1:0);
  add('مدة السكري '+c.dur+' سنة',c.dur>=10?1:0);
  add(a.hypo?'هبوط شديد خلال آخر 3 أشهر':'نوبات هبوط أقل من مرة أسبوعياً',a.hypo?5.5:c.hypo);
  add('HbA1c '+c.a1c+'%',c.a1c>9?2:c.a1c>=7.5?1:0);
  const tr=cls.includes('prandial')?[2.5,'إنسولين قاعدي ووجبات']:cls.includes('basal')?[1.5,'إنسولين قاعدي']:cls.includes('su')?[0.5,'سلفونيل يوريا من الجيل الثاني']:[0,''];
  add('العلاج: '+tr[1],tr[0]);
  add('قياس السكر المنزلي '+(c.smbg==='no'?'غير مُجرى':'غير منتظم'),c.smbg==='no'?2:c.smbg==='sub'?1:0);
  add('مضاعفات حادة حديثة',c.acute);
  add('مرض قلب وأوعية مستقر',['af-hf','af','ihd'].includes(p.cl.cv)?2:0);
  const e=a.ckd?20:p.cl.egfr;add(a.ckd?'فشل كلوي متقدم (إجابة المريض)':'eGFR '+p.cl.egfr,e<30?6.5:e<45?4:e<60?2:0);
  add('حمل أو رضاعة',a.preg?6.5:0);
  add('فوق 70 بلا مساعدة في المنزل',p.age>70&&a.alone?3.5:0);
  add('ساعات الصيام '+FAST.toFixed(1),FAST>=16?1:0);
  const tot=it.reduce((s,x)=>s+x[1],0);return {tot,it,cat:tot<=3?'low':tot<=6?'moderate':'high'};}
function risks(id){const p=PP(id),a=per[id].answers,out=[];
  const d=idfdar(id);if(d) out.push({k:'dm',n:'السكري',cat:d.cat,t:'درجة IDF-DAR '+d.tot,src:'IDFDAR',d});
  if(p.cl.cv){const c=p.cl.cv;out.push({k:'cv',n:'القلب',cat:(p.cl.lvef&&p.cl.lvef<=35)?'high':c==='htn'?'low':'moderate',
    t:c==='af-hf'?'رجفان أذيني وقصور قلب غير شديد (LVEF '+p.cl.lvef+'%)':c==='af'?'رجفان أذيني مستقر على مميع':'ضغط مستقر',src:'HEART'});}
  if(a.ckd||p.cl.egfr<60) out.push({k:'renal',n:'الكلى',cat:a.ckd||p.cl.egfr<30?'high':'moderate',t:a.ckd?'فشل متقدم أو غسيل (إجابة المريض)':'المرحلة الثالثة، eGFR '+p.cl.egfr,src:'RAK'});
  if(p.cl.epi) out.push({k:'epi',n:'الصرع',cat:p.cl.epi==='controlled'?'low':'high',t:p.cl.epi==='controlled'?'مستقر، بلا نوبات منذ سنتين':'غير مستقر',src:'EPI'});
  if(a.preg) out.push({k:'preg',n:'الحمل',cat:'high',t:'حامل أو مرضع',src:'IDFDAR'});
  if(p.cl.acute) out.push({k:'acute',n:'مرض حاد',cat:'high',t:p.cl.acute+'، مؤقت حتى الشفاء',src:'NONE'});
  return out;}
function overall(id){const R=risks(id);let cat='low';R.forEach(r=>{if(RK[r.cat]>RK[cat])cat=r.cat;});
  const acuteOnly=R.filter(r=>r.cat==='high').every(r=>r.k==='acute')&&R.some(r=>r.k==='acute');
  const auto=cat==='high'&&!acuteOnly?'visit':cat==='low'?'remote':'phone';
  return {cat,R,auto,path:per[id].path||auto};}

function triage(id){
  const p=PP(id), s=per[id], reasons=[];
  s.items.filter(i=>i.esc&&!i.dd).forEach(i=>reasons.push({lvl:'red',t:i.d.ar+': '+i.esc}));
  s.items.filter(i=>i.doctor&&!i.esc&&!i.dd).forEach(i=>reasons.push({lvl:'red',t:i.d.ar+': أحاله الصيدلي للطبيب.'}));
  QUESTIONS.forEach(q=>{if(s.answers[q.k]&&!(q.red&&s.clearance)) reasons.push({lvl:q.red?'red':'amber',t:q.t+(q.red?'. يستوجب تقييم الطبيب قبل قرار الصيام.':'. يحتاج مواعيد مخصصة.')});});
  if(s.clearance==='no') reasons.push({lvl:'red',t:'قرار الطبيب: لا يُنصح بالصيام هذا العام.'});
  if(s.items.some(i=>i.dd)) reasons.push({lvl:'amber',t:'قرّر الطبيب في '+s.items.filter(i=>i.dd).length+' من الأدوية.'});
  if(s.items.some(i=>i.crit)) reasons.push({lvl:'amber',t:'يتناول دواءً حرجاً: مراجعة الصيدلي إلزامية.'});
  if(medsOf(id).length>=5) reasons.push({lvl:'amber',t:'تعدد الأدوية: '+medsOf(id).length+' أدوية.'});
  let lvl='green';
  s.items.forEach(i=>{const l=i.dd?'amber':i.doctor?'red':i.lvl;if(LV[l]>LV[lvl]) lvl=l;});
  reasons.forEach(r=>{if(LV[r.lvl]>LV[lvl]) lvl=r.lvl;});
  reasons.sort((a,b)=>LV[b.lvl]-LV[a.lvl]);
  return {lvl,reasons};
}
const TRI={red:{t:'أحمر',d:'مراجعة الطبيب قبل الصيام'},amber:{t:'برتقالي',d:'يحتاج مراجعة الصيدلي'},green:{t:'أخضر',d:'تغيير توقيت بسيط'}};
function flagged(id){const f=per[id].fu;return FUQ.some(q=>f[q.k]==='نعم');}
function status(id){const s=per[id];
  if(s.signed&&flagged(id)) return {c:'s-call',t:'اتصل اليوم'};
  if(s.signed) return {c:'s-done',t:'أُرسلت الخطة'};
  if(needsDoctor(id)) return {c:'s-doc',t:'عند الطبيب'};
  return {c:'s-wait',t:'بانتظار مراجعتك'};}
function drStatus(id){if(per[id].signed)return {c:'s-done',t:'وصلت للمريض'};return needsDoctor(id)?{c:'s-wait',t:'بانتظار اعتمادك'}:{c:'s-done',t:'اعتمدتها'};}

/* clinical checks on the pharmacist's edits */
function checks(i,id=S.pid){
  const w=[];const d=i.doses,p=PP(id);
  if(i.doctor) return w;
  if(d.length===2&&d[0]===d[1]&&i.crit) w.push('جرعتان في وقت واحد لدواء حرج: هذا تضاعف للجرعة.');
  else if(d.length===2&&d[0]===d[1]) w.push('الجرعتان في الوقت نفسه: تأكد أن هذا مقصود.');
  if(i.d.cls==='thyroid'&&!d.includes('suhoor')) w.push('يُفضّل على معدة فارغة قبل السحور.');
  if(i.d.cls==='diuretic'&&d.includes('suhoor')) w.push('مدر البول مع السحور قد يزيد العطش والجفاف نهاراً.');
  if(i.d.cls==='sglt2'&&(p.age>=65||medsOf(id).some(([k])=>(DRUGS[k]||{}).cls==='diuretic')||p.cl.egfr<60)) w.push('مع كبر السن أو مدر البول أو ضعف الكلى: نصحت توصيات Heart 2022 بتجنبه، فناقش الإيقاف المؤقت مع الطبيب.');
  if(i.f===2&&d.length===1&&(i.crit||i.d.cls==='metformin')) w.push('كان يُؤخذ مرتين: تأكد من تعديل الجرعة اليومية.');
  return w;
}
/* medicine alerts for the doctor: interactions and timing conflicts created by the fasting window */
function alertsFor(id){const s=per[id],p=PP(id),A=[];
  const live=s.items.filter(i=>!i.stop);
  const it=c=>live.find(i=>i.d.cls===c), has=c=>!!it(c);
  if(has('warfarin')&&has('abx')) A.push({lvl:'red',k:'تداخل دوائي',t:'وارفارين مع '+it('abx').d.ar+': المضاد الحيوي قد يرفع INR ويزيد خطر النزيف.',fix:'افحص INR خلال 3 إلى 5 أيام من بدء المضاد.',src:'LABEL'});
  if(has('sglt2')&&has('diuretic')) A.push({lvl:'amber',k:'تداخل دوائي',t:it('sglt2').d.ar+' مع '+it('diuretic').d.ar+': يزيدان الجفاف وهبوط الضغط، والصيام يضاعف الخطر.',fix:'راجع جرعة المدر، أو أوقف مثبط SGLT2 مؤقتاً في رمضان.',src:'HEART'});
  const bb=live.find(i=>i.key==='bisoprolol'), hyp=live.filter(i=>['su','basal','prandial'].includes(i.d.cls));
  if(bb&&hyp.length) A.push({lvl:'amber',k:'تداخل دوائي',t:'بيسوبرولول يخفي أعراض هبوط السكر مثل الرجفة والخفقان، والمريض على '+hyp.map(i=>i.d.ar).join(' و')+'.',fix:'علّم المريض أن التعرق والجوع قد يكونان العلامة الوحيدة، وأن يقيس السكر عند أي شك.',src:'LABEL'});
  const lev=it('thyroid');
  ['calcium','ppi'].forEach(c=>{const o=it(c);if(!lev||!o)return;
    if(lev.doses.some(d=>o.doses.includes(d))) A.push({lvl:'red',k:'تعارض توقيت',t:'ليفوثيروكسين و'+o.d.ar+' في الوقت نفسه: يقل امتصاص هرمون الغدة.',fix:'افصل بينهما 4 ساعات على الأقل: الهرمون قبل السحور، و'+o.d.ar+' مع الإفطار.',src:'LABEL'});
    else A.push({lvl:'ok',k:'تعارض توقيت',t:'فصلت الخطة بين ليفوثيروكسين و'+o.d.ar+' بأكثر من 4 ساعات.',src:'LABEL'});});
  if(has('metformin')&&p.cl.egfr<45) A.push({lvl:'red',k:'جرعة الكلى',t:'ميتفورمين مع eGFR '+p.cl.egfr+': الجرعة تحتاج مراجعة.',src:'LABEL'});
  ['iftar','suhoor','bed'].forEach(z=>{const n=live.filter(i=>i.doses.includes(z)).length;
    if(n>=6) A.push({lvl:'amber',k:'عبء الجرعات',t:n+' أدوية مع '+SLOT[z]+' وحده، وهذا يرفع احتمال النسيان.',fix:'انظر هل يمكن نقل أحدها إلى قبل النوم أو إيقافه مؤقتاً.',src:'NONE'});});
  return A;}

      :`<div class="bub in">ممتاز، شكراً لك. استمر على الخطة، وتقبّل الله صيامك.</div>`;

/* ===== Shared store: links every screen and device ===== */
let DB=null;const queue={};
function ser(id){const x=per[id];return {v:1,answers:x.answers,extra:x.extra||[],items:x.items.map(i=>({k:i.key,d:i.doses,x:i.doctor,a:i.approved,dd:!!i.dd,ds:i.ds||null,st:!!i.stop,kp:!!i.keep})),clearance:x.clearance||null,signed:x.signed,fu:x.fu,taken:x.taken,path:x.path||null,cds:x.cds||null,appt:x.appt||null,drOk:!!x.drOk};}
function applyDoc(id,data){
  const p=PP(id), x=per[id], prevSigned=!!x.signed, prevFlag=x.signed&&flagged(id);
  const tab=x.tab;
  initPatient(p); const y=per[id]; y.tab=tab;
  if(data){
    y.answers={...(data.answers||{})};
    y.extra=Array.isArray(data.extra)?data.extra.filter(e=>Array.isArray(e)&&DRUGS[e[0]]).map(e=>[e[0],+e[1]||1]):[];
    const items=draftFor(p,y.answers,y.extra);
    (data.items||[]).forEach((o,ix)=>{const i=items[ix];if(!i||o.k!==i.key)return;i.doses=Array.isArray(o.d)?o.d.slice(0,2):i.doses;i.doctor=!!o.x;i.approved=!!o.a;i.dd=!!o.dd;i.ds=o.ds||null;i.stop=!!o.st;i.keep=!!o.kp;});
    y.clearance=data.clearance||null;y.items=items;y.signed=data.signed||null;y.fu={...(data.fu||{})};y.taken={...(data.taken||{})};
    y.path=PATH[data.path]?data.path:null;y.appt=FREE.includes(data.appt)?data.appt:null;y.drOk=!!data.drOk;y.cds=typeof data.cds==='string'?data.cds:null;
  }
  if(!prevSigned&&y.signed&&id===S.pid&&MODE!=='pharm'){y.tab='plan';setTimeout(showToast,60);}
  if(!prevFlag&&y.signed&&flagged(id)&&MODE!=='patient') setTimeout(()=>deskToast(p.name+' أجاب في المتابعة ويحتاج اتصالاً اليوم.'),60);
}
function applyCfg(c){
  const d=CFG0();
  if(c&&typeof c==='object'){
    if(MODES[c.mode])d.mode=c.mode; if(CLINICS[c.clinic])d.clinic=c.clinic; if(CITIES[c.city])d.city=c.city;
    if(c.his==='down')d.his='down'; if(c.sms==='off')d.sms='off';
    if(c.ovr&&typeof c.ovr==='object')Object.keys(c.ovr).forEach(k=>{const r=Object.values(RULES).find(x=>x.id===k);if(r&&r.alt&&r.alt.some(a=>a[0]===c.ovr[k]))d.ovr[k]=c.ovr[k];});
    if(Array.isArray(c.log))d.log=c.log.filter(l=>l&&typeof l.t==='string').slice(0,30).map(l=>({t:String(l.t),who:String(l.who||''),what:String(l.what||'')}));
  }
  CFG=d;computeTimes();
}
function save(id=S.pid){
  if(!DB){localSave();return;}
  const body=ser(id);

function saveCfg(){
  if(!DB){localSave();return;}
  const body=JSON.parse(JSON.stringify(CFG));
  queue.cfg=(queue.cfg||Promise.resolve()).then(()=>DB.doc('config/main').set(body)).catch(e=>{S.sync='error';paintSync();});

/* same-computer link for downloaded files: tabs share browser storage */
const LKEY='safefast-demo-v2';
function localSave(){try{const all={};PATIENTS.forEach(p=>all[p.id]=ser(p.id));localStorage.setItem(LKEY,JSON.stringify({t:Date.now(),cases:all,cfg:CFG}));}catch(_){}}
function localLoad(raw){try{const o=JSON.parse(raw||localStorage.getItem(LKEY)||'null');if(!o||!o.cases)return false;applyCfg(o.cfg);PATIENTS.forEach(p=>applyDoc(p.id,o.cases[p.id]||null));return true;}catch(_){return false;}}
try{
  if(!(window.claude&&claude.use)){
    if(localLoad()) S.sync='tabs'; else {localSave();S.sync='tabs';}
    window.addEventListener('storage',e=>{if(e.key!==LKEY||DB)return;localLoad(e.newValue);if(DRAG)render.pending=true;else rerenderKeep();});
  }
}catch(_){}
function paintSync(){
  const els=document.querySelectorAll('[data-sync]');
  const t={tabs:'مربوط بنوافذ هذا الكمبيوتر',local:'غير مربوط',connecting:'جارٍ الربط',live:'مربوط مباشرة',stale:'الربط بطيء',readonly:'عرض فقط',error:'تعذّر الحفظ'}[S.sync];
  els.forEach(el=>{el.dataset.s=S.sync;el.querySelector('span').textContent=t;});
}
function showToast(){const t=$('#toast');if(t){t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3400);}}
function deskToast(msg){const t=$('#dtoast');if(!t)return;t.querySelector('span').textContent=msg;t.classList.add('show');clearTimeout(deskToast.h);deskToast.h=setTimeout(()=>t.classList.remove('show'),5000);}
function resetDemo(){CFG=CFG0();computeTimes();PATIENTS.forEach(initPatient);seedDemo();PATIENTS.forEach(p=>save(p.id));saveCfg();S.pick=null;render();}
/* independent hosting: Firebase Firestore, docs stored as JSON text */
function fbAdapter(fs){
  const enc=o=>({j:JSON.stringify(o),t:Date.now()});
  const dec=d=>{const x=d.data();try{return x&&typeof x.j==='string'?JSON.parse(x.j):(x||null);}catch(_){return null;}};
  return {doc:p=>({set:b=>fs.doc(p).set(enc(b))}),
    collection:c=>({onSnapshot:(ok,err)=>fs.collection(c).onSnapshot({includeMetadataChanges:true},s=>ok({metadata:s.metadata,docs:s.docs.map(d=>({id:d.id,data:()=>dec(d)}))}),err)})};
}
(async()=>{
  try{ let db=null;
    if(window.SF_FIREBASE&&window.firebase&&firebase.firestore){
      if(!firebase.apps.length) firebase.initializeApp(window.SF_FIREBASE);
      db=fbAdapter(firebase.firestore());
    } else if(window.claude&&claude.use){ db=await claude.use('db'); }
    if(!db) return;
    DB=db;S.sync='connecting';paintSync();
    const timer=setTimeout(()=>{if(S.sync==='connecting'){S.sync='stale';paintSync();}},10000);
    const redraw=()=>{if(DRAG){render.pending=true;} else rerenderKeep();paintSync();};
    db.collection('config').onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==='main');applyCfg(d?d.data():null);
      PATIENTS.forEach(p=>{const x=per[p.id];x.items.forEach(i=>{if(!i.approved&&!i.dd&&!i.doctor&&i.r.alt&&i.f===1&&!x.signed)i.doses=planFor(i.r,i.f);});});redraw();},()=>{});
    db.collection('cases').onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);if(S.sync!=='readonly'&&S.sync!=='error')S.sync='live';}
      const have={};snap.docs.forEach(d=>{have[d.id]=d.data();});
      PATIENTS.forEach(p=>applyDoc(p.id,have[p.id]||null));
      redraw();
    },e=>{clearTimeout(timer);S.sync='error';paintSync();});
  }catch(_){}
})();

/* ===== Render & events ===== */
function render(){
  document.body.dataset.pane=S.pane;document.body.classList.toggle('m-patient',MODE==='patient');document.body.classList.toggle('m-pharm',MODE==='pharm');
  if(MODE==='patient'){$('#shell').innerHTML=vPhone();bind();paintSync();return;}
  if(CFG.mode==='pharmacy'&&(S.view==='doctor'||S.view==='ehr')) S.view='clinic';
  $('#vDoctor').hidden=CFG.mode==='pharmacy';$('#vEhr').hidden=CFG.mode==='pharmacy';
  $('#vClinic').textContent=CFG.mode==='doctor'?'الخطة':'الصيدلي';
  [['vClinic','clinic'],['vDoctor','doctor'],['vEhr','ehr'],['vDash','dash'],['vSet','set']].forEach(([b,v])=>$('#'+b).setAttribute('aria-pressed',S.view===v));
  document.body.dataset.view=S.view;
  let html;
  if(S.view==='dash') html=vDash();
  else if(S.view==='set') html=vSettings();
  else if(S.view==='ehr') html=vQueue()+vEhr();
  else {const main=S.view==='doctor'?vDoctor():vWork();html=vQueue()+main+(MODE==='pharm'?'':vPhone());}
  $('#shell').innerHTML=html;
  bind();paintSync();
}
function rerenderKeep(){const a=$('#app');const y=a?a.scrollTop:0;const w=window.scrollY;render();const b=$('#app');if(b)b.scrollTop=y;window.scrollTo(0,w);}
function invalidate(ix){const s=st();if(ix!=null) s.items[ix].approved=false;s.signed=null;s.drOk=false;s.fu={};s.taken={};}
function setSlot(ix,v){const i=st().items[ix];
  if(v==='doctor'){i.doctor=true;i.doses=[];i.dd=false;i.stop=false;i.keep=false;} else {i.doctor=false;i.doses=v.split('+');}
  invalidate(ix);}
function bind(){
  document.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{S.dd=null;S.pid=b.dataset.pid||b.dataset.v;S.pick=null;S.why=false;S.open=-1;S.idf=false;render();});
  document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const s=st();S.dd=null;s.clearance=b.dataset.v||b.dataset.clr;s.signed=null;save();render();});
  document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{S.dd=null;const i=st().items[+b.dataset.dr],v=b.dataset.v;i.dd=true;i.doctor=false;i.stop=false;i.keep=false;
    if(v==='stop'){i.stop=true;i.doses=[];}else if(v==='keep'){i.keep=true;i.doses=[];}else{i.doses=v.split('+');i.ds=i.ds||'same';}i.approved=false;invalidate();save();render();});
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{S.dd=null;const i=st().items[+b.dataset.ds];i.ds=b.dataset.v;i.approved=false;invalidate();save();render();});
  document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{applySug(st().items[+b.dataset.sug]);invalidate();save();render();});
  document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{S.dd=null;const s=st(),o=overall(S.pid);s.path=b.dataset.v===o.auto?null:b.dataset.v;save();render();});
  const wb=$('#whyBtn');if(wb) wb.onclick=()=>{S.why=!S.why;render();};
  const ib=$('#idfBtn');if(ib) ib.onclick=()=>{S.idf=!S.idf;render();};
  const jb=$('#jsonBtn');if(jb) jb.onclick=()=>{S.json=!S.json;render();};
  document.querySelectorAll('[data-ddt]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.dd=S.dd===b.dataset.ddt?null:b.dataset.ddt;render();const m=document.querySelector('.ddm [aria-selected="true"]')||document.querySelector('.ddm button');m&&m.focus();});
  document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{S.pane=b.dataset.pane;render();});
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{S.dd=null;setSlot(+b.dataset.set,b.dataset.v);S.pick=null;save();render();});
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const i=st().items[+b.dataset.ap];i.approved=!i.approved;if(!i.approved)invalidate();save();render();});
  const ap=$('#apAll');if(ap) ap.onclick=()=>{st().items.forEach(i=>i.approved=true);save();render();};
  const sim=$('#simSign');if(sim) sim.onclick=()=>{st().items.forEach(i=>i.approved=true);const s=st();s.drOk=true;s.signed={by:signer(),at:'اليوم'};s.tab='plan';save();render();showToast();};
  const ds=$('#drSign');if(ds) ds.onclick=()=>{const s=st();s.drOk=true;save();deskToast('اعتمدت خطة '+P().name+'، وانتقلت للصيدلي.');render();};
  const sg=$('#sign');if(sg) sg.onclick=()=>{const s=st();s.signed={by:signer(),at:'اليوم'};s.tab='plan';save();render();if(MODE!=='pharm')showToast();};
  // manual medicine entry while the hospital link is down
  document.querySelectorAll('[data-addk]').forEach(b=>b.onclick=()=>{S.dd=null;S.addK=b.dataset.v;render();});
  document.querySelectorAll('[data-addf]').forEach(b=>b.onclick=()=>{S.dd=null;S.addF=b.dataset.v;render();});
  const am=$('#addMed');if(am) am.onclick=()=>{const s=st();s.extra.push([S.addK,+S.addF]);s.items.push(makeItem(S.addK,+S.addF));
    deskToast(S.addK==='other'?'أضيف الدواء وأُحيل للطبيب تلقائياً لأنه غير موجود في المكتبة.':'أضيف '+DRUGS[S.addK].ar+' بتوقيت حسب القواعد.');S.addK=null;S.addF=null;invalidate();save();render();};
  // CDS card inside the hospital system
  document.querySelectorAll('[data-cds]').forEach(b=>b.onclick=()=>{const s=st(),a=b.dataset.cds;
    if(a==='open'){S.view='doctor';render();window.scrollTo(0,0);return;}
    if(a==='undo'){s.cds=null;save();render();return;}
    if(a==='accept'){let n=0;s.items.forEach(i=>{if((i.esc||i.doctor)&&!i.dd&&applySug(i))n++;});
      const o=overall(S.pid);if(!s.clearance){if(s.items.some(i=>i.keep))s.clearance='no';else if(o.path!=='visit')s.clearance='yes';}
      s.cds='accepted';invalidate();if(drReady(S.pid))s.drOk=true;save();logCfg('د. سعد (من نظام المستشفى)','اعتمد '+n+' من مقترحات الإرشاد لـ '+P().name);saveCfg();render();}});
  document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{S.dd=null;const s=st();s.appt=b.dataset.v;save();logCfg('د. سعد','حجز موعداً لـ '+P().name+' في '+fd(b.dataset.v)+' (appointment-book)');saveCfg();deskToast('حُجز موعد '+P().name+' في '+fd(b.dataset.v)+'، ووصل إشعار للمريض.');render();});
  document.querySelectorAll('[data-dis]').forEach(b=>b.onclick=()=>{S.dd=null;const s=st();s.cds='dismissed:'+b.dataset.v;save();logCfg('د. سعد (من نظام المستشفى)','أخفى بطاقة '+P().name+': '+b.dataset.v);saveCfg();render();});
  // settings
  document.querySelectorAll('[data-cfg]').forEach(b=>b.onclick=()=>{S.dd=null;const k=b.dataset.cfg,v=b.dataset.v;if(CFG[k]===v){render();return;}
    const names={mode:['طريقة التشغيل',MODES],clinic:['نوع العيادة',Object.fromEntries(Object.entries(CLINICS).map(([a,c])=>[a,c.n]))],city:['المدينة',Object.fromEntries(Object.entries(CITIES).map(([a,c])=>[a,c[0]]))],his:['الربط مع النظام',{up:'يعمل',down:'منقطع'}],sms:['الرسالة النصية',{on:'مفعّلة',off:'موقفة'}]}[k];
    CFG[k]=v;if(k==='city')computeTimes();logCfg('مدير النظام (تجريبي)',names[0]+': '+names[1][v]);saveCfg();render();});
  const reapply=id=>{PATIENTS.forEach(p=>{const x=per[p.id];if(x.signed)return;let ch=false;x.items.forEach(i=>{if(i.r.id===id&&!i.approved&&!i.dd&&!i.doctor&&i.f===1){i.doses=planFor(i.r,i.f);ch=true;}});if(ch)save(p.id);});};
  document.querySelectorAll('[data-ovr]').forEach(b=>b.onclick=()=>{S.dd=null;const id=b.dataset.ovr,r=Object.values(RULES).find(x=>x.id===id),v=b.dataset.v;
    if(r.plan(1)[0]===v)delete CFG.ovr[id];else CFG.ovr[id]=v;logCfg('د. سعد (بروتوكول العيادة)',r.name+': '+(r.alt.find(a=>a[0]===v)||[,''])[1]);reapply(id);saveCfg();render();});
  document.querySelectorAll('[data-rst]').forEach(b=>b.onclick=()=>{const id=b.dataset.rst,r=Object.values(RULES).find(x=>x.id===id);delete CFG.ovr[id];logCfg('د. سعد (بروتوكول العيادة)',r.name+': إرجاع للإرشاد');reapply(id);saveCfg();render();});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st().tab=b.dataset.tab;render();});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const s=st();s.answers[b.dataset.q]=!s.answers[b.dataset.q];
    s.items.forEach(i=>i.approved=false);invalidate();save();rerenderKeep();});
  document.querySelectorAll('[data-fu]').forEach(b=>b.onclick=()=>{st().fu[b.dataset.fu]=b.dataset.v;save();rerenderKeep();});
  document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{const s=st();s.taken[b.dataset.take]=!s.taken[b.dataset.take];save();rerenderKeep();});
  // move medicines: pointer drag (mouse + touch) or tap-then-tap
  const moveTo=(ix,di,zone)=>{const i=st().items[ix];
    if(zone==='doctor'){if(i.doctor)return;i.doctor=true;i.doses=[];i.dd=false;i.stop=false;i.keep=false;}
    else if(i.doctor){i.doctor=false;i.doses=[zone];}
    else {if(i.doses[di]===zone)return;i.doses[di]=zone;}
    invalidate(ix);save();};
  const zoneAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('[data-zone]');};
  document.querySelectorAll('.tok').forEach(t=>{
    const ix=+t.dataset.ix, di=+t.dataset.di;
    t.addEventListener('pointerdown',e=>{
      if(e.button!==0)return; e.preventDefault();
      const sx=e.clientX, sy=e.clientY; let ghost=null, over=null;
      try{t.setPointerCapture(e.pointerId);}catch(_){}
      const mv=ev=>{
        if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=t.cloneNode(true);ghost.classList.add('dragghost');ghost.style.width=t.offsetWidth+'px';document.body.appendChild(ghost);t.classList.add('dragging');DRAG=true;}
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
          const z=zoneAt(ev.clientX,ev.clientY);if(z!==over){over&&over.classList.remove('over');over=z;over&&over.classList.add('over');}}
      };
      const up=ev=>{t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointercancel',up);
        DRAG=false;if(ghost){ghost.remove();const z=zoneAt(ev.clientX,ev.clientY);if(z&&ev.type==='pointerup')moveTo(ix,di,z.dataset.zone);S.pick=null;render();}
        else if(ev.type==='pointerup'){S.pick=(S.pick&&S.pick.ix===ix&&S.pick.di===di)?null:{ix,di};render();}
      };
      t.addEventListener('pointermove',mv);t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
    });
    t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();S.pick=(S.pick&&S.pick.ix===ix&&S.pick.di===di)?null:{ix,di};render();
      const n=document.querySelector('.comp[data-zone]');n&&n.focus();}});
  });
  document.querySelectorAll('[data-zone]').forEach(z=>{
    z.tabIndex=S.pick?0:-1;
    const go=()=>{if(!S.pick)return;moveTo(S.pick.ix,S.pick.di,z.dataset.zone);S.pick=null;render();};
    z.addEventListener('click',e=>{if(e.target.closest('.tok'))return;go();});
    z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}
$('#reset').onclick=()=>{const b=$('#reset');if(b.dataset.c){delete b.dataset.c;resetDemo();deskToast('أُعيدت التجربة إلى البداية على كل الأجهزة.');}else{b.dataset.c=1;deskToast('اضغط زر الإعادة مرة ثانية للتأكيد. سيُعاد كل المرضى والإعدادات إلى البداية.');setTimeout(()=>delete b.dataset.c,4000);}};
document.addEventListener('click',e=>{if(S.dd&&!e.target.closest('.dd')){S.dd=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.dd){const id=S.dd;S.dd=null;render();const b=document.querySelector(`[data-ddt="${id}"]`);b&&b.focus();}});
$('#vClinic').onclick=()=>{S.view='clinic';render();};
$('#vDoctor').onclick=()=>{S.view='doctor';render();};
$('#vEhr').onclick=()=>{S.view='ehr';render();};
$('#vDash').onclick=()=>{S.view='dash';render();};
$('#vSet').onclick=()=>{S.view='set';render();};
(function(){const r=document.documentElement,b=$('#theme');
  const dark=()=>r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  b.onclick=()=>{r.dataset.theme=dark()?'light':'dark';};})();
render();
